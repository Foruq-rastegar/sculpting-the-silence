<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sculpting the Silence</title>
<link rel="stylesheet" href="css/global.css">
</head>
<body>

  <!-- Persistent background point field, sits behind every stage's .frame
       (but above each stage's own .background-layer). Driven by js/field.js
       via window.Field; each stage wires up its own timing. -->
  <canvas id="field-canvas" class="field-canvas"></canvas>

  <!-- Round 8, item 4 — every dev/testing control is tucked behind this
       single "more" toggle: near-invisible, top-left, pulled out of the
       normal tab order (tabindex="-1") — not part of the exhibition flow
       a regular visitor would ever see or reach. See shared.js's
       setupDevMoreMenu(). -->
  <button type="button" class="dev-more-toggle" id="dev-more-toggle-btn" tabindex="-1" aria-label="Dev tools">&#8943;</button>

  <div class="dev-more-panel" id="dev-more-panel" hidden>
    <div class="dev-more-panel__section">
      <p class="dev-more-panel__heading">Stages</p>
      <!-- Dev/testing only: one button per stage, jumps straight there,
           skipping everything before it. See shared.js's
           setupDevStageSkipButtons() — populated there, empty here since
           the button count follows TOTAL_STAGES rather than being
           hardcoded. -->
      <div class="dev-stage-skip" id="dev-stage-skip"></div>
    </div>

    <div class="dev-more-panel__section">
      <p class="dev-more-panel__heading">Settings</p>
      <!-- Dev/testing only: on-screen buttons that toggle frame/field
           visibility live, independent of the ?screen= URL param (which
           can still be used to set the initial state), plus a manual
           full-reload reset and a one-click entries-registry clear. See
           shared.js's setupDevScreenToggleButtons()/
           setupDevResetEntriesButton()/setupDevRefreshButton(). -->
      <div class="dev-screen-toggles" id="dev-screen-toggles">
        <button type="button" class="dev-screen-toggles__btn" id="dev-toggle-frame-btn">Frame</button>
        <button type="button" class="dev-screen-toggles__btn" id="dev-toggle-field-btn">Field</button>
        <button type="button" class="dev-screen-toggles__btn" id="dev-reset-entries-btn">Reset entries</button>
        <button type="button" class="dev-screen-toggles__btn" id="dev-refresh-btn">Refresh</button>
      </div>
    </div>
  </div>

  <!-- Stage 1: Content Warning -->
  <section id="stage-1" class="stage stage-1 is-active" data-stage="1">
    <div class="background-layer" style="background-image: url('assets/images/s1_banner_sensitive_content_img.png');"></div>
    <div class="frame">
      <!-- See .moment-content-box in global.css — replaces the old
           .frame--intro frosted-blur treatment (removed) with the same
           dark panel used everywhere else. -->
      <div class="moment-content-box moment-content-box--s1-warning">
        <img class="stage-1__icon" src="assets/icons/s1_sensetive_content_icon.svg" alt="" width="110" height="91">
        <h1 class="frame__title stage-1__title">Content Warning</h1>
        <p class="frame__body stage-1__body">This experience contains emotionally intense content that some people may find overwhelming.</p>
        <button type="button" class="button" id="stage-1-continue-btn">Run the Experience</button>
      </div>
    </div>
  </section>

  <!-- Stage 2: automatic sequence — social feeds video, blackout graph, gunfire warning -->
  <section id="stage-2" class="stage stage-2" data-stage="2">
    <div class="background-layer stage-2__background"></div>

    <!-- Mirrors the load_anim_1/load_anim_2 spinner beats that play in
         .frame right after the video ends (see stage2.js's
         playFieldSpinnerSequence) onto the field layer itself, so the
         field-only dev screen also gets a loading indicator during that
         pause. Deliberately NOT a ".moment" — it isn't part of the
         moments[] queue below, and .moment.is-active is toggled wholesale
         by that queue's own activate(), which would otherwise fight this
         element's visibility. Always flex-centered; renders nothing when
         empty and shows the spinner exactly when STS.runSpinner populates
         it. Sits right after .background-layer so field.js's canvas
         reparenting (which also inserts immediately after
         .background-layer) lands *between* the two on first run, giving
         the stacking order background-layer, canvas, this, .frame. -->
    <div class="stage-2__moment--field-spinner" id="stage-2-field-spinner"></div>

    <div class="frame stage-2__frame">

      <div class="moment stage-2__moment stage-2__moment--video is-active" id="stage-2-moment-video" data-moment="1">
        <!-- No static autoplay attribute here — a bare autoplay video stays
             a live DOM element even while hidden (display:none doesn't
             pause media), so the browser could play it (with sound) right
             on page load once autoplay-with-sound was already permitted
             for this origin in the same session (e.g. after the idle
             reset's reload) — bypassing stage2.js's own load()+play()
             trigger entirely. Playback is driven solely by that JS trigger
             instead, exactly when stage 2's moment begins. -->
        <video id="stage-2-video" class="stage-2__video" src="assets/video/s2_protest_socialmedia_feeds_vid.mp4" playsinline preload="none"></video>
      </div>

      <!-- Reused for every spinner-only beat (load_anim_1/2 before the
           cutoff moment, and the load_anim_1 stand-in for the disabled
           s2_mom_04) — content is injected by STS.runSpinner. -->
      <div class="moment stage-2__moment stage-2__moment--spinner" id="stage-2-moment-spinner"></div>

      <div class="moment stage-2__moment stage-2__moment--cutoff" id="stage-2-moment-cutoff" data-moment="2">
        <!-- See .moment-content-box in global.css. Purely additive: same
             two children as before, unchanged. -->
        <div class="moment-content-box moment-content-box--s2-cutoff">
          <p class="frame__body" id="stage-2-cutoff-text"></p>
          <div class="counter-widget">
            <p class="counter-number" id="stage-2-counter-number"></p>
            <p class="counter-caption" id="stage-2-counter-caption"></p>
          </div>
        </div>
      </div>

      <div class="moment stage-2__moment stage-2__moment--gunfire" id="stage-2-moment-gunfire" data-moment="3">
        <!-- See .moment-content-box in global.css. Purely additive: same
             three children as before, unchanged (currently unused while
             ENABLE_S2_MOM_04 is false in stage2.js). -->
        <div class="moment-content-box moment-content-box--s2-gunfire">
          <p class="frame__body" id="stage-2-gunfire-text"></p>
          <div class="waveform-indicator" id="stage-2-waveform">
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
            <span class="waveform-indicator__bar"></span>
          </div>
          <audio id="stage-2-gunshot-audio" src="assets/audio/s2_gunshot_warning_snd.mp3" preload="none"></audio>
        </div>
      </div>

    </div>

    <div class="moment stage-2__moment--blackout" id="stage-2-moment-blackout"></div>
  </section>

  <!-- Stage 3: message moments — button-driven attempt ladders -->
  <section id="stage-3" class="stage stage-3" data-stage="3">
    <div class="background-layer stage-3__background"></div>
    <div class="frame stage-3__frame">
      <div class="message-moment" id="stage-3-moment-mount"></div>
    </div>
    <audio id="stage-3-gunshot-audio" src="assets/audio/s3_gunshot_snd.mp3" preload="none" loop></audio>
    <audio id="stage-3-underscore-audio" src="assets/audio/s3_underscore_loop.mp3" preload="none" loop></audio>
  </section>

  <!-- Stage 4: name moments — button-driven, ending in one auto-advancing moment -->
  <section id="stage-4" class="stage stage-4" data-stage="4">
    <div class="background-layer stage-4__background"></div>
    <div class="frame stage-4__frame">
      <div class="message-moment" id="stage-4-moment-mount"></div>
    </div>
  </section>

  <!-- Stage 5: "#11780" choice screen (s4_mom_22), branching to the closing
       form (s4_mom_23) or straight past it, then the collective board (s5_mom_24) -->
  <section id="stage-5" class="stage stage-5" data-stage="5">
    <div class="background-layer stage-5__background"></div>
    <div class="frame stage-5__frame">
      <div class="message-moment" id="stage-5-moment-mount"></div>
    </div>

    <!-- s5_mom_24 — full-viewport collective board, not a .frame card.
         Hidden until s5_mom_23's closing statement finishes typing.
         PRESERVED AS A FALLBACK — the new shared final scene below is the
         current default (see stage4-5.js's USE_NEW_FINAL_SCENE flag); this
         old board is left fully intact, untouched, so flipping that flag
         back reverts to it instantly. -->
    <div class="collective-board" id="stage-5-board" hidden>
      <p class="collective-board__footer" id="stage-5-board-footer"></p>
      <button type="button" class="collective-board__export-btn" id="stage-5-board-export-btn">Export</button>
      <div class="collective-board__names" id="stage-5-board-names"></div>
      <div class="collective-board__tooltip" id="stage-5-board-tooltip" hidden></div>
    </div>

    <!-- New shared final scene (js/final-scene.js) — a fixed deterministic
         dot pattern, identical between this canvas and field.js's own
         #field-canvas once Field.startFinalScene() switches it over. A
         separate, independently toggleable section from #stage-5-board
         above, not a replacement of it. -->
    <div class="final-scene" id="stage-5-final-scene" hidden>
      <canvas id="stage-5-final-scene-canvas" class="final-scene__canvas"></canvas>
      <p class="final-scene__footer">Thank you for calling them out of silence.</p>
    </div>
  </section>

  <script src="js/shared.js"></script>
  <script src="js/final-scene.js"></script>
  <script src="js/field.js"></script>
  <script src="js/stage1.js"></script>
  <script src="js/stage2.js"></script>
  <script src="js/stage3.js"></script>
  <script src="js/stage4-5.js"></script>
</body>
</html>
